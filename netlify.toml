[build]
  command = "npm run build"
  publish = "dist"

# Every route is pre-rendered to its own HTML file at build time, so no SPA
# catch-all redirect is needed. Unknown URLs get dist/404.html with a real
# 404 status.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
